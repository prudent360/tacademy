# Vercel's Hobby plan runs cron jobs once a day, which is too coarse for "class starts in
# 1 hour" reminders. This workflow calls the same endpoint every 15 minutes instead.
# Add repository secrets SITE_URL (e.g. https://academy.example.com) and CRON_SECRET.
name: Class reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    if: ${{ vars.REMINDERS_ENABLED != 'false' }}
    steps:
      - name: Send due reminders
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL or CRON_SECRET secret missing; skipping."; exit 0; fi
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
